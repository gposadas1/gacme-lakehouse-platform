name: terraform

on:
  pull_request:
    branches: [main]
    paths: ["infra/**", "ci/**", "bootstrap/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["infra/**", "ci/**", ".github/workflows/**"]
  # Manual runs from the Actions tab: deploy (re)creates dev, destroy tears it down to stop idle cost
  workflow_dispatch:
    inputs:
      action:
        description: deploy or destroy the dev environment
        type: choice
        options: [deploy, destroy]
        default: deploy

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive infra

      - name: Validate every root (no backend)
        run: |
          for root in infra/envs/*/*/; do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done

      - name: Shellcheck
        run: shellcheck -x bootstrap/*.sh ci/*.sh

  # PRs plan against dev only; prod is never touched by an unmerged branch
  plan-dev:
    if: github.event_name == 'pull_request'
    needs: lint
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: dev
      mode: plan

  apply-dev:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.action == 'deploy')
    needs: lint
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: dev
      mode: apply

  # Manual only. State, identities and federation stay, so a deploy run brings dev back.
  destroy-dev:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: dev
      mode: destroy

  # Phase 1b adds apply-prod here: needs apply-dev, gated by the prod environment's reviewer
