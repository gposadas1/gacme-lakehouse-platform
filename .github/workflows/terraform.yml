name: terraform

on:
  pull_request:
    branches: [main]
    paths: ["infra/**", "ci/**", "bootstrap/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["infra/**", "ci/**", ".github/workflows/**"]
  # Manual runs from the Actions tab: deploy (re)creates an environment's workspace, destroy
  # tears it down to stop idle cost. Prod is only ever changed from here.
  workflow_dispatch:
    inputs:
      environment:
        description: which environment
        type: choice
        options: [dev, prod]
        default: dev
      action:
        description: deploy or destroy
        type: choice
        options: [deploy, destroy]
        default: deploy

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive infra

      - name: Validate every root (no backend)
        run: |
          for root in infra/envs/*/*/; do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done

      - name: Shellcheck
        run: shellcheck -x bootstrap/*.sh ci/*.sh

  # PRs plan against dev only; prod is never touched by an unmerged branch
  plan-dev:
    if: github.event_name == 'pull_request'
    needs: lint
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: dev
      mode: plan

  apply-dev:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (inputs.environment == 'dev' && inputs.action == 'deploy'))
    needs: lint
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: dev
      mode: apply

  # Manual only: prod changes only when someone runs the workflow for it. GitHub's required
  # reviewer gate needs a public repo (or Enterprise); add it to the prod environment and
  # chain this job after apply-dev once the repo is public.
  apply-prod:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' && inputs.action == 'deploy'
    needs: lint
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: prod
      mode: apply

  # Manual only. Removes the workspace, keeps the lake, catalog, state and identities, so a
  # deploy run brings the environment back.
  destroy-dev:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' && inputs.action == 'destroy'
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: dev
      mode: destroy

  destroy-prod:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' && inputs.action == 'destroy'
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: prod
      mode: destroy
