name: terraform

on:
  pull_request:
    branches: [main]
    paths: ["infra/**", "bootstrap/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive infra

      - name: Validate every root (no backend)
        run: |
          for root in infra/envs/*/*/; do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done

      - name: Shellcheck bootstrap
        run: shellcheck -x bootstrap/*.sh

  # PRs plan against dev only; prod is never touched by an unmerged branch
  plan-dev:
    if: github.event_name == 'pull_request'
    needs: lint
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: dev
      mode: plan

  apply-dev:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: lint
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: dev
      mode: apply

  # Phase 1b adds apply-prod here: needs apply-dev, gated by the prod environment's reviewer
