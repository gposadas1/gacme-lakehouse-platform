# Reusable job: init, check, plan, and optionally apply one environment's Terraform root.
#
# OIDC trust depends on whether the job declares a GitHub Environment:
#   mode=plan  -> no environment -> token subject ...:pull_request  (trusted by the dev identity only)
#   mode=apply -> environment    -> token subject ...:environment:<env> (main-only, prod needs approval)
# Variables resolve from the environment when one is declared, otherwise from repo level.
name: terraform-env

on:
  workflow_call:
    inputs:
      environment:
        description: dev or prod
        required: true
        type: string
      mode:
        description: plan or apply
        required: true
        type: string

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  terraform:
    name: ${{ inputs.mode }} ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode == 'apply' && inputs.environment || '' }}
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    defaults:
      run:
        working-directory: infra/envs/${{ inputs.environment }}/azure
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Init
        run: >
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}"
          -backend-config="use_oidc=true"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        if: inputs.mode == 'apply'
        run: terraform apply -input=false -auto-approve tfplan
