# Reusable job: plan, apply or destroy one environment's Terraform layers via ci/terraform.sh.
#
# OIDC trust depends on whether the job declares a GitHub Environment:
#   mode=plan  -> no environment -> token subject ...:pull_request  (trusted by the dev identity only)
#   mode=apply|destroy -> environment -> token subject ...:environment:<env> (main-only, prod needs approval)
# Variables resolve from the environment when one is declared, otherwise from repo level.
name: terraform-env

on:
  workflow_call:
    inputs:
      environment:
        description: dev or prod
        required: true
        type: string
      mode:
        description: plan, apply or destroy
        required: true
        type: string

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  terraform:
    name: ${{ inputs.mode }} ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode != 'plan' && inputs.environment || '' }}
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true" # azurerm provider and backend
      DATABRICKS_AUTH_TYPE: github-oidc-azure # databricks provider, same identity
      TFSTATE_RG: ${{ vars.TFSTATE_RG }}
      TFSTATE_SA: ${{ vars.TFSTATE_SA }}
      ENVIRONMENT: ${{ inputs.environment }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false # the script reads `terraform output -raw`

      - name: Terraform (${{ inputs.mode }})
        run: ci/terraform.sh "$ENVIRONMENT" "$MODE"
